<title>สมุดพก ส.ส.</title>
<style>

/* Layout: one phone-width report book. Ink is the only "color"; semantic flag hues live only on legal-status pills. */
:root{
  --canvas:#ECECE8; --card:#FFFFFF; --sunken:#E1E1DC; --hair:rgba(28,30,34,.11);
  --ink:#1C1E22; --ink-2:#43474F; --ink-3:#5E626A;
  --accent:#1C1E22; --accent-ink:#FFFFFF;
  --f1-bg:#E4E4E1; --f1-ink:#3F4248;
  --f2-bg:#F4E7B8; --f2-ink:#5E4700;
  --f3-bg:#F6DCC4; --f3-ink:#7E3700;
  --f4-bg:#F5D2CE; --f4-ink:#8E1A12;
  --f0-bg:#DCEADC; --f0-ink:#22592C;
  --lift:0 1px 2px rgba(30,32,36,.05),0 8px 20px -12px rgba(30,32,36,.20);
  --lift-2:0 2px 6px rgba(30,32,36,.06),0 30px 60px -24px rgba(30,32,36,.32);
  --font:"Anuphan","IBM Plex Sans Thai","Noto Sans Thai","Noto Sans Thai UI","Sukhumvit Set","Thonburi","Leelawadee UI","Tahoma",-apple-system,system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --canvas:#111214; --card:#1C1D20; --sunken:#2A2B2F; --hair:rgba(237,237,234,.12);
    --ink:#EDEDEA; --ink-2:#C4C5C9; --ink-3:#A2A4AA;
    --accent:#EDEDEA; --accent-ink:#111214;
    --f1-bg:#2E2F33; --f1-ink:#D2D3D6;
    --f2-bg:#3A3112; --f2-ink:#F2D977;
    --f3-bg:#3E2614; --f3-ink:#F6B987;
    --f4-bg:#421A1A; --f4-ink:#F5A69F;
    --f0-bg:#1A3220; --f0-ink:#A3D6AB;
    --lift:0 1px 2px rgba(0,0,0,.4),0 8px 18px -12px rgba(0,0,0,.6);
    --lift-2:0 2px 8px rgba(0,0,0,.5),0 30px 60px -24px rgba(0,0,0,.7);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --canvas:#111214; --card:#1C1D20; --sunken:#2A2B2F; --hair:rgba(237,237,234,.12);
  --ink:#EDEDEA; --ink-2:#C4C5C9; --ink-3:#A2A4AA;
  --accent:#EDEDEA; --accent-ink:#111214;
  --f1-bg:#2E2F33; --f1-ink:#D2D3D6;
  --f2-bg:#3A3112; --f2-ink:#F2D977;
  --f3-bg:#3E2614; --f3-ink:#F6B987;
  --f4-bg:#421A1A; --f4-ink:#F5A69F;
  --f0-bg:#1A3220; --f0-ink:#A3D6AB;
  --lift:0 1px 2px rgba(0,0,0,.4),0 8px 18px -12px rgba(0,0,0,.6);
  --lift-2:0 2px 8px rgba(0,0,0,.5),0 30px 60px -24px rgba(0,0,0,.7);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{height:100%}
body{margin:0;min-height:100%;background:var(--canvas);color:var(--ink);font-family:var(--font);font-size:17px;line-height:1.65;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.stage{display:flex;justify-content:center;padding-block:24px;padding-inline:16px;min-height:100%}
.phone{width:min(392px,100%);height:min(840px,calc(100vh - 48px));min-height:600px;background:var(--canvas);border-radius:44px;box-shadow:var(--lift-2);overflow:hidden;position:relative;display:flex;flex-direction:column}
@media (max-width:480px){
  html,body{height:100%}
  .stage{padding:0;height:100%}
  .phone{width:100%;height:100%;min-height:0;border-radius:0;box-shadow:none}
}
.screens{position:relative;flex:1 1 auto;min-height:0}
.screen{position:absolute;inset:0;display:none;flex-direction:column}
.screen.on{display:flex}
.bar{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:56px;padding:8px 14px 4px 16px;flex:0 0 auto}
.brand{font-weight:700;font-size:17px;letter-spacing:.01em}
.asof{font-size:13px;color:var(--ink-2);background:var(--sunken);padding:3px 10px;border-radius:999px;white-space:nowrap;font-variant-numeric:tabular-nums}
.back{display:inline-flex;align-items:center;gap:2px;min-height:44px;min-width:44px;padding:0 10px 0 2px;border:0;background:none;font-size:17px;font-weight:600;cursor:pointer;border-radius:12px}
.scroll{flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:4px 16px 36px}
.eyebrow{font-size:14px;font-weight:600;color:var(--ink-2);margin:6px 0 0}
.ltitle{font-size:30px;line-height:1.3;font-weight:700;margin:2px 0 6px;text-wrap:balance}
.mtitle{font-size:24px;line-height:1.38;font-weight:700;margin:2px 0 8px;text-wrap:balance}
.lead{font-size:17px;color:var(--ink-2);margin:0 0 18px}
.meta{font-size:16px;color:var(--ink-2);margin:0}
.sec{margin-top:30px}
.sec-h{font-size:20px;font-weight:700;margin:0 0 2px}
.sec-c{font-size:15px;color:var(--ink-2);margin:0 0 12px;line-height:1.55}
.card{background:var(--card);border-radius:20px;box-shadow:var(--lift);padding:16px}
.list{background:var(--card);border-radius:20px;box-shadow:var(--lift);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;width:100%;min-height:64px;padding:14px 14px 14px 16px;border:0;background:none;text-align:left;cursor:pointer}
.row + .row{border-top:1px solid var(--hair)}
.row-main{flex:1 1 auto;min-width:0}
.row-t{font-size:17px;font-weight:600;line-height:1.45;margin:0}
.row-s{font-size:15px;color:var(--ink-2);margin:2px 0 0;line-height:1.5}
.chev{flex:0 0 auto;color:var(--ink-3)}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:500;line-height:1.3;padding:5px 11px;border-radius:999px;background:var(--sunken);color:var(--ink-2);white-space:nowrap}
.chip.wait{background:transparent;box-shadow:inset 0 0 0 1.5px var(--ink-3);color:var(--ink-2)}
.chip.tag{background:var(--ink);color:var(--canvas)}
.seat{height:6px;border-radius:3px;background:var(--sunken);margin-top:8px;overflow:hidden}
.seat i{display:block;height:100%;background:var(--ink-2);border-radius:3px}
.steps{display:flex;gap:3px;margin-top:8px}
.steps i{flex:1;height:6px;border-radius:3px;background:var(--sunken)}
.steps i.on{background:var(--ink)}
.sample{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;color:var(--ink);padding:9px 14px;border-radius:12px;margin:2px 0 10px;background:repeating-linear-gradient(-45deg,var(--sunken) 0 7px,var(--card) 7px 14px)}
.sample span{background:var(--card);padding:1px 8px;border-radius:6px}
.hatch{background:repeating-linear-gradient(-45deg,var(--sunken) 0 7px,transparent 7px 14px)}
.note{border-radius:18px;padding:14px 16px;box-shadow:inset 0 0 0 1.5px var(--hair);background:transparent}
.note-t{font-weight:700;margin:0 0 2px;font-size:17px}
.note p{margin:0;color:var(--ink-2);font-size:15px;line-height:1.6}
.dim{display:flex;gap:12px;align-items:flex-start;width:100%;padding:16px;border:0;background:none;text-align:left;cursor:pointer}
.dim + .dim{border-top:1px solid var(--hair)}
.dim-v{flex:0 0 auto;text-align:right;min-width:72px}
.big{font-size:28px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.big small{font-size:15px;font-weight:500;color:var(--ink-2)}
.evl{display:inline-block;font-size:14px;font-weight:600;color:var(--ink);text-decoration:underline;text-decoration-style:dotted;text-underline-offset:4px;margin-top:6px}
.bar-track{height:8px;border-radius:4px;background:var(--sunken);overflow:hidden;margin-top:10px}
.bar-track i{display:block;height:100%;background:var(--ink)}
.btn{display:flex;align-items:center;justify-content:center;width:100%;min-height:52px;border:0;border-radius:14px;background:var(--accent);color:var(--accent-ink);font-size:17px;font-weight:600;cursor:pointer;padding:0 18px}
.tbtn{display:inline-flex;align-items:center;min-height:44px;border:0;background:none;padding:0 2px;font-size:16px;font-weight:600;text-decoration:underline;text-underline-offset:4px;cursor:pointer;color:var(--ink)}
.lbl{display:block;font-size:15px;font-weight:600;color:var(--ink-2);margin:0 0 8px}
.search{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:16px;box-shadow:var(--lift);min-height:58px;padding:0 6px 0 16px}
.search input{flex:1 1 auto;min-width:0;border:0;background:transparent;font:inherit;font-size:17px;color:var(--ink);height:56px;outline:none}
.search input::placeholder{color:var(--ink-3)}
.search input::-webkit-search-cancel-button{-webkit-appearance:none;display:none}
.search:focus-within{box-shadow:var(--lift),0 0 0 2px var(--ink)}
.clear{width:44px;height:44px;border:0;background:none;border-radius:12px;cursor:pointer;color:var(--ink-2);display:flex;align-items:center;justify-content:center}
.ladder{list-style:none;margin:0;padding:0}
.lstep{display:flex;gap:14px;position:relative;padding-bottom:18px}
.lstep:last-child{padding-bottom:0}
.lstep::before{content:"";position:absolute;left:15px;top:32px;bottom:0;width:2px;background:var(--sunken)}
.lstep:last-child::before{display:none}
.lstep.done::before{background:var(--ink)}
.lstep.now::before{background:var(--sunken)}
.dot{flex:0 0 auto;width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;background:var(--card);box-shadow:inset 0 0 0 2px var(--sunken);color:var(--ink-3);position:relative;z-index:1;font-variant-numeric:tabular-nums}
.lstep.done .dot{background:var(--ink);color:var(--canvas);box-shadow:none}
.lstep.now .dot{box-shadow:0 0 0 4px var(--sunken)}
.lstep.wait .dot{box-shadow:inset 0 0 0 2px var(--ink-3);background:transparent;border:0}
.lbody{flex:1 1 auto;min-width:0;padding-top:3px}
.lname{font-weight:600;margin:0;line-height:1.45}
.lsub{font-size:15px;color:var(--ink-2);margin:2px 0 0}
.evbtn{display:block;width:100%;text-align:left;margin-top:8px;padding:10px 12px;border:0;border-radius:12px;background:var(--sunken);cursor:pointer;font-size:15px;line-height:1.5;min-height:44px}
.evbtn b{display:block;font-weight:600}
.evbtn span{color:var(--ink-2)}
.status-hd{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.att{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--sunken);margin:12px 0 14px}
.att i{display:block;height:100%}
.s1{background:var(--ink)} .s2{background:var(--ink-3)} .s3{background:repeating-linear-gradient(-45deg,var(--ink-3) 0 2px,var(--sunken) 2px 6px)}
.leg{display:flex;align-items:center;gap:10px;padding:8px 0;font-size:16px}
.leg + .leg{border-top:1px solid var(--hair)}
.sw{flex:0 0 auto;width:14px;height:14px;border-radius:4px}
.leg .n{margin-left:auto;font-weight:700;font-variant-numeric:tabular-nums}
.fpill{display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:700;padding:5px 12px 5px 6px;border-radius:999px;line-height:1.3}
.fpill .lv{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:22px;padding:0 6px;border-radius:999px;background:var(--card);font-size:13px}
.F1{background:var(--f1-bg);color:var(--f1-ink)} .F2{background:var(--f2-bg);color:var(--f2-ink)} .F3{background:var(--f3-bg);color:var(--f3-ink)} .F4{background:var(--f4-bg);color:var(--f4-ink)} .F0{background:var(--f0-bg);color:var(--f0-ink)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:12px 0 0;font-size:15px}
.kv dt{color:var(--ink-2)} .kv dd{margin:0;font-weight:500;min-width:0}
.presume{margin-top:14px;padding:12px 14px;border-radius:12px;background:var(--sunken);font-size:15px;line-height:1.6;font-weight:500}
.filters{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px;margin:0 -2px}
.fchip{flex:0 0 auto;min-height:44px;padding:0 16px;border-radius:999px;border:0;background:var(--card);box-shadow:inset 0 0 0 1.5px var(--hair);font-size:15px;font-weight:500;cursor:pointer;white-space:nowrap}
.fchip[aria-pressed="true"]{background:var(--ink);color:var(--canvas);box-shadow:none;font-weight:600}
.reply{border-radius:18px;padding:14px 16px;background:var(--card);box-shadow:inset 0 0 0 1.5px var(--hair)}
.reply-h{display:flex;align-items:center;justify-content:space-between;gap:8px;font-weight:700;font-size:16px}
.reply p{margin:6px 0 0;font-size:15px;color:var(--ink-2);line-height:1.6}
.foot{margin-top:36px;padding-top:16px;border-top:1px solid var(--hair);font-size:13px;color:var(--ink-2);line-height:1.7}
.foot p{margin:0 0 4px}
.tabs{flex:0 0 auto;display:flex;border-top:1px solid var(--hair);background:var(--card);padding-bottom:env(safe-area-inset-bottom,0px)}
.tab{flex:1;min-height:62px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border:0;background:none;color:var(--ink-3);font-size:13px;font-weight:500;cursor:pointer}
.tab[aria-selected="true"]{color:var(--ink);font-weight:700}
.tab[aria-selected="true"] svg{stroke-width:2.3}
.mrow{display:block;width:100%;text-align:left;border:0;background:none;padding:14px 16px;cursor:pointer}
.mrow + .mrow{border-top:1px solid var(--hair)}
.mtable{width:100%;border-collapse:collapse;font-size:15px}
.mtable td{padding:9px 0;border-top:1px solid var(--hair);vertical-align:top}
.mtable tr:first-child td{border-top:0}
.mtable td:first-child{width:40px;font-weight:700;font-variant-numeric:tabular-nums}
.mtable td:last-child{text-align:right;font-weight:600;white-space:nowrap;padding-left:10px;font-variant-numeric:tabular-nums}
.mlist{margin:6px 0 0;padding-left:20px;font-size:15px;line-height:1.65;color:var(--ink-2)}
.mlist li{margin:3px 0}
.mp{margin:6px 0 0;font-size:15px;color:var(--ink-2);line-height:1.65}
.stack{display:flex;flex-direction:column;gap:12px}
.sheet-wrap{position:absolute;inset:0;z-index:20;display:none}
.sheet-wrap.on{display:block}
.scrim{position:absolute;inset:0;background:rgba(10,11,13,.42);border:0;width:100%;cursor:pointer}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:86%;overflow-y:auto;background:var(--card);border-radius:24px 24px 0 0;padding:10px 18px calc(22px + env(safe-area-inset-bottom,0px));box-shadow:var(--lift-2);animation:up .24s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}
.grab{width:40px;height:5px;border-radius:3px;background:var(--sunken);margin:0 auto 12px}
.sheet h3{font-size:22px;line-height:1.4;margin:2px 0 6px}
.sheet .lead{margin-bottom:12px}
.sval{font-size:34px;font-weight:700;line-height:1.2;margin:4px 0 10px;font-variant-numeric:tabular-nums}
.range{margin:14px 0}
.range label{display:flex;justify-content:space-between;font-size:16px;font-weight:600}
.range label span{font-variant-numeric:tabular-nums;color:var(--ink-2)}
.range input{width:100%;accent-color:var(--ink);height:44px}
.result{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:14px 16px;border-radius:16px;background:var(--sunken);margin:8px 0 12px}
.toast{position:absolute;left:16px;right:16px;bottom:84px;background:var(--ink);color:var(--canvas);padding:12px 18px;border-radius:16px;font-size:15px;line-height:1.5;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;transform:translateY(8px);z-index:30;text-align:center}
.toast.show{opacity:1;transform:none}
.empty{text-align:center;padding:22px 16px}
.empty p{margin:4px 0 0;color:var(--ink-2);font-size:15px}
.gap8{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.radar{display:block;width:100%;height:auto;margin:4px 0 0;font-family:var(--font)}
.radar text{font-size:13.5px}
.rleg{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:14px;color:var(--ink-2);margin:6px 0 0}
.rleg span{display:inline-flex;align-items:center;gap:8px}
.rleg i{display:inline-block;width:18px;height:10px;border-radius:3px;background:color-mix(in srgb,var(--ink) 16%,transparent);box-shadow:inset 0 0 0 2px var(--ink)}
.rleg i.dash{height:0;border-radius:0;background:none;box-shadow:none;border-top:2px dashed var(--ink-2)}
.rleg i.dot{height:0;border-radius:0;background:none;box-shadow:none;border-top:3px dotted var(--ink)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:0;min-width:0;padding:12px 12px 10px;border:0;border-radius:20px;background:var(--card);box-shadow:var(--lift);text-align:left;cursor:pointer}
.tile-t{font-size:16px;font-weight:700;line-height:1.4}
.tile-s{font-size:13px;color:var(--ink-2);line-height:1.4}
.tile .radar{margin:4px 0}
.card > .radar-sm{max-width:170px;margin:10px auto 0}
.rleg i.na{background:repeating-linear-gradient(-45deg,var(--ink-3) 0 1.5px,var(--sunken) 1.5px 5px);box-shadow:none}
.cap{margin:12px 0 0;padding:10px 12px;border-radius:12px;background:var(--sunken);font-size:15px;font-weight:600;line-height:1.55}
.vrow{display:flex;align-items:center;gap:12px;width:100%;min-height:60px;padding:12px 14px 12px 16px;border:0;background:none;text-align:left;cursor:pointer}
.vrow + .vrow{border-top:1px solid var(--hair)}
.vrow .big{font-size:24px;white-space:nowrap}
.vrow.na .big{font-size:15px;font-weight:600;color:var(--ink-3)}
.abar{position:relative;height:10px;border-radius:5px;background:var(--sunken);margin:12px 0 6px}
.abar i{display:block;height:100%;border-radius:5px;background:var(--ink)}
.abar b{position:absolute;top:-6px;bottom:-6px;width:2px;margin-left:-1px;background:var(--ink-2);box-shadow:0 0 0 1.5px var(--card);border-radius:1px}
.abar.hatch{background:repeating-linear-gradient(-45deg,var(--sunken) 0 6px,transparent 6px 12px);box-shadow:inset 0 0 0 1px var(--hair)}
.pct{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.hl{display:inline-block;width:2px;height:16px;background:var(--ink-2);vertical-align:-3px;margin-right:8px;border-radius:1px}
.formula{margin:10px 0 4px;padding:12px 14px;border-radius:12px;background:var(--sunken);font-size:15px;line-height:1.7;font-weight:600}
.fact{padding:14px 16px}
.fact + .fact{border-top:1px solid var(--hair)}
.fact-l{font-size:14px;font-weight:600;color:var(--ink-2);margin:0}
.fact-v{font-size:17px;font-weight:600;margin:2px 0 0;line-height:1.5}
a.tbtn{text-decoration:underline}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

[hidden]{display:none!important}
.fx{flex:0 0 auto;display:flex;align-items:center;justify-content:center;padding:12px 14px;background:repeating-linear-gradient(-45deg,var(--ink) 0 10px,var(--ink-2) 10px 20px);z-index:40}
.fx span{background:var(--card);color:var(--ink);font-size:16px;font-weight:700;line-height:1.45;text-align:center;padding:6px 12px;border-radius:10px}
.flink{color:inherit;text-decoration:underline;text-underline-offset:3px}
.chip.few{background:transparent;box-shadow:inset 0 0 0 1.5px var(--ink-3);font-size:12px;padding:2px 8px;color:var(--ink-2)}
.lchart{display:block;width:100%;height:auto;margin:6px 0;font-family:var(--font)}
.tile .lchart{margin:6px 0 0}
.ttable td:first-child{width:auto;white-space:nowrap;font-weight:600}
.ttable td:nth-child(2){font-weight:400;color:var(--ink-2);text-align:left;padding-left:10px}
.tscroll{overflow-x:auto;background:var(--card);border-radius:20px;box-shadow:var(--lift);-webkit-overflow-scrolling:touch}

<script>

var D = null;

function isNum(v){ return typeof v === 'number' && isFinite(v); }
function fmt(n){ return isNum(n) ? String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, ',') : '—'; }

function extLink(u, label, cls){ var s = safeUrl(u); if (!s) return ''; return '<a class="'+(cls || 'tbtn')+'" href="'+esc(s)+'" target="_blank" rel="noopener noreferrer">'+esc(label)+'</a>'; }

function ladderName(v){ var x = own(LADDER, String(v)) ? LADDER[String(v)] : null; return x != null ? String(x) : String(v); }

/* Thai Buddhist-calendar date; timestamps shown in Bangkok time */
function thDate(s){
  if (typeof s !== 'string' || !s) return null;
  var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s), y, mo, d;
  if (m) { y = +m[1]; mo = +m[2]; d = +m[3]; }
  else { var t = Date.parse(s); if (isNaN(t)) return null; var b = new Date(t + 7 * 3600e3); y = b.getUTCFullYear(); mo = b.getUTCMonth() + 1; d = b.getUTCDate(); }
  if (mo < 1 || mo > 12) return null;
  return d + ' ' + TM[mo - 1] + ' ' + (y + 543);
}
function thPeriod(p){ var m = /^(\d{4})(?:-(\d{2}))?$/.exec(String(p || '')); if (!m) return esc(p); return (m[2] ? TM[+m[2] - 1] + ' ' : '') + (+m[1] + 543); }

/* ---------- line chart (plain SVG, monochrome) ---------- */
function lineChart(o){
  var W = o.small ? 150 : 320, H = o.h || (o.small ? 90 : 170), L = o.small ? 6 : 34, Rr = o.small ? 6 : 10, T = 10, B = o.small ? 10 : 34;
  var n = o.periods.length, lo = o.lo, hi = o.hi;
  function X(i){ return n === 1 ? (L + (W - Rr)) / 2 : L + i * (W - L - Rr) / (n - 1); }
  function Y(v){ return T + (hi - v) / (hi - lo) * (H - T - B); }
  var h = '<svg class="lchart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(o.label || '')+'">';
  [lo, (lo + hi) / 2, hi].forEach(function(g){ h += '<line x1="'+L+'" x2="'+(W - Rr)+'" y1="'+Y(g).toFixed(1)+'" y2="'+Y(g).toFixed(1)+'" style="stroke:var(--hair);stroke-width:1"/>'; if (!o.small) h += '<text x="'+(L - 6)+'" y="'+(Y(g) + 4).toFixed(1)+'" text-anchor="end" style="fill:var(--ink-3);font-size:11px">'+Math.round(g)+'%</text>'; });
  if (!o.small) {
    /* short month labels; year only on the first label and where the year changes; thinned above 6 points */
    var step = n > 6 ? Math.ceil(n / 6) : 1, shown = [];
    for (var si = 0; si < n; si += step) shown.push(si);
    if (shown[shown.length - 1] !== n - 1 && (n - 1) - shown[shown.length - 1] >= step / 2 + 0.5) shown.push(n - 1);
    var prevY = null;
    shown.forEach(function(i){
      var m = /^(\d{4})(?:-(\d{2}))?$/.exec(String(o.periods[i] || '')); if (!m) return;
      var yr = +m[1] + 543, anc = n > 1 && i === n - 1 ? 'end' : (n > 1 && i === 0 ? 'start' : 'middle');
      var top = m[2] ? TM[+m[2] - 1] : String(yr), sub = m[2] && yr !== prevY ? String(yr) : '';
      prevY = yr;
      h += '<text x="'+X(i).toFixed(1)+'" y="'+(H - B + 14)+'" text-anchor="'+anc+'" style="fill:var(--ink-3);font-size:11px">'+top+'</text>';
      if (sub) h += '<text x="'+X(i).toFixed(1)+'" y="'+(H - B + 27)+'" text-anchor="'+anc+'" style="fill:var(--ink-3);font-size:10px">'+sub+'</text>';
    });
  }
  o.series.forEach(function(s){
    var segs = [], cur = [];
    s.vals.forEach(function(v, i){ if (isNum(v)) cur.push(X(i).toFixed(1)+','+Y(Math.max(lo, Math.min(hi, v))).toFixed(1)); else { if (cur.length) segs.push(cur); cur = []; } });
    if (cur.length) segs.push(cur);
    var st = s.kind === 'dot' ? 'stroke:var(--ink);stroke-width:2;stroke-dasharray:0.1 4.2;stroke-linecap:round' : 'stroke:var(--ink);stroke-width:'+(o.small ? 2 : 2.4)+';stroke-linejoin:round';
    segs.forEach(function(sg){ if (sg.length > 1) h += '<polyline points="'+sg.join(' ')+'" style="fill:none;'+st+'"/>'; });
    if (s.kind !== 'dot') s.vals.forEach(function(v, i){ if (!isNum(v)) return; var few = o.few && o.few[i]; h += '<circle cx="'+X(i).toFixed(1)+'" cy="'+Y(Math.max(lo, Math.min(hi, v))).toFixed(1)+'" r="'+(o.small ? 2.5 : 3.5)+'" style="fill:'+(few ? 'var(--card)' : 'var(--ink)')+';stroke:var(--ink);stroke-width:1.6"/>'; });
  });
  return h + '</svg>';
}

  openSheet(html);
  function calc(){
    var sw = 0, s = 0;
    for (var i = 0; i < vals.length; i++) { var v = +document.getElementById('w'+i).value; document.getElementById('wv'+i).textContent = v; sw += v; s += v * vals[i]; }
    document.getElementById('wres').textContent = sw ? Math.round(s / sw) : '—';
  }
  sheet.querySelectorAll('[data-w]').forEach(function(r){ r.addEventListener('input', calc); });
  calc();
}
function legendSheet(){
  var h = '<h3>ความหมายของแต่ละระดับ</h3><p class="lead" style="font-size:15px">ทุกระดับแสดงแยกจากผลงาน และไม่หักคะแนน</p>';
  [1,2,3,4,0].forEach(function(i){ h += '<div style="padding:10px 0;border-top:1px solid var(--hair)">'+fpill(i)+'<p class="mp" style="margin-top:6px">'+FLV[i].d+'</p></div>'; });
  h += '<p class="presume">'+PRESUME+'</p><div style="margin-top:12px"><button class="btn" data-close>เข้าใจแล้ว</button></div>';
  openSheet(h);
}
var toastEl = document.getElementById('toast'), tt;
function toast(msg){ toastEl.textContent = msg; toastEl.classList.add('show'); clearTimeout(tt); tt = setTimeout(function(){ toastEl.classList.remove('show'); }, 3200); }

/* =====================================================================
   HASH ROUTER   #party/<name> · #mp/<id> · #promise/<party>/<id> · #att
   #house · #trend · #method · #sample/party · #sample/mp/<id> · #sample/promise/<i>
   ===================================================================== */
var depth = 0, fresh = false, scrollMem = {}, homeBuilt = false;
function parseHash(){ var h = location.hash.replace(/^#\/?/, ''); if (!h) return []; return h.split('/').map(function(s){ try { return decodeURIComponent(s); } catch (e) { return s; } }); }
function route(){
  closeSheet();
  var r = parseHash(), screen = 'home', tab = 'home';
  if (r[0] === 'party' && r[1] != null) { screen = 'party'; renderParty(r[1]); }
  else if (r[0] === 'promise' && r.length >= 3) { screen = 'promise'; if (renderPromise(r[1], r[2]) === 'party') screen = 'party'; }
  else if (r[0] === 'mp' && r[1] != null) { screen = 'mp'; if (renderMP(r[1]) === 'party') screen = 'party'; }
  else if (r[0] === 'att') { screen = 'att'; renderAtt(); }
  else if (r[0] === 'house') { screen = 'house'; renderHouse(); }
  else if (r[0] === 'trend') { screen = 'month'; tab = 'month'; renderTrend(); }
  else if (r[0] === 'method') { screen = 'method'; tab = 'method'; renderMethod(); }
  else if (r[0] === 'sample' && r[1] === 'party') { screen = 'party'; renderSampleParty(); }
  else if (r[0] === 'sample' && r[1] === 'mp') { screen = 'mp'; if (renderSampleMP(r[2]) === 'party') screen = 'party'; }
  else if (r[0] === 'sample' && r[1] === 'promise') { screen = 'promise'; if (renderSamplePromise(r[2]) === 'party') screen = 'party'; }
  else if (!homeBuilt) { renderHome(); homeBuilt = true; }
  document.querySelectorAll('.screen').forEach(function(el){ el.classList.toggle('on', el.id === 's-' + screen); });
  document.querySelectorAll('.tab').forEach(function(t){ t.setAttribute('aria-selected', String(t.dataset.tab === tab)); });
  var sc = document.querySelector('#s-' + screen + ' .scroll');
  if (sc) sc.scrollTop = (!fresh && scrollMem[location.hash] != null) ? scrollMem[location.hash] : 0;
  fresh = false;
}
function rememberScroll(){ var sc = document.querySelector('.screen.on .scroll'); if (sc) scrollMem[location.hash] = sc.scrollTop; }
function go(hash){ rememberScroll(); fresh = true; depth++; if (location.hash === '#' + hash) route(); else location.hash = hash; }
document.addEventListener('click', function(e){
  var t;
  if ((t = e.target.closest('[data-close]'))) closeSheet();
  if ((t = e.target.closest('[data-toast]'))) { toast(t.dataset.toast); return; }
  if ((t = e.target.closest('[data-ev]'))) { evidenceSheet(t.dataset.ev); return; }
  if ((t = e.target.closest('[data-sheet]'))) { if (t.dataset.sheet === 'weights') weightsSheet(); else legendSheet(); return; }
  if ((t = e.target.closest('[data-trend]'))) { trendMode = t.dataset.trend === 'year' ? 'year' : 'month'; var s0 = document.querySelector('#s-month .scroll'), y = s0 ? s0.scrollTop : 0; renderTrend(); var s1 = document.querySelector('#s-month .scroll'); if (s1) s1.scrollTop = y; return; }
  if ((t = e.target.closest('[data-filter]'))) { flagFilter = t.dataset.filter; var sc = document.getElementById('mpScroll'), yy = sc ? sc.scrollTop : 0; renderSampleMP(t.dataset.mp); var sc2 = document.getElementById('mpScroll'); if (sc2) sc2.scrollTop = yy; return; }
  if ((t = e.target.closest('[data-scroll]'))) { var el = document.getElementById(t.dataset.scroll); if (el) el.scrollIntoView({behavior:'smooth', block:'start'}); return; }
  if ((t = e.target.closest('[data-go]'))) { if (/^sample\/mp\//.test(t.dataset.go)) flagFilter = 'ทั้งหมด'; go(t.dataset.go); return; }
  if ((t = e.target.closest('[data-back]'))) { rememberScroll(); if (depth > 0) { depth--; history.back(); } else { location.hash = ''; } return; }
  if ((t = e.target.closest('[data-tab]')) || (t = e.target.closest('[data-tab-go]'))) {
    var id = t.dataset.tab || t.dataset.tabGo; rememberScroll(); fresh = true; depth = 0;
    var h = id === 'month' ? 'trend' : id === 'method' ? 'method' : '';
    if (location.hash.replace(/^#/, '') === h) route(); else location.hash = h;
    return;
  }
});
document.addEventListener('keydown', function(e){ if (e.key === 'Escape') closeSheet(); });
window.addEventListener('hashchange', route);

if (FIX) document.getElementById('fxBanner').hidden = false;
renderHome(); homeBuilt = true;
route();
})();
</script>
